<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vantage H1 · Figma Racing Data Deck</title>
  <style>
    /*
      Figma implementation note:
      - The linked Figma frame is reproduced from the user-provided frame image because
        the connector account cannot inspect that file's editable node properties.
      - Only the data presentation layer changes. H1 facts remain unchanged.
      - The racing image, red spotlight and asphalt stage are fixed across all ten pages.
    */
    :root {
      --canvas: #030202;
      --panel: rgba(8, 4, 5, .66);
      --panel-soft: rgba(20, 5, 8, .58);
      --ink: #fbf7f3;
      --muted: #c7bbb7;
      --faint: rgba(255, 255, 255, .12);
      --orange: #f04b16;
      --orange-hot: #ff5b1a;
      --red: #bd142a;
      --red-hot: #ed2947;
      --gold: #ff6a22;
      --figma-card-alpha: .64;
      --stage-w: 1600px;
      --stage-h: 900px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body {
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: -.01em;
    }
    button { font: inherit; }
    .viewport { position: fixed; inset: 0; overflow: hidden; background: #000; }
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--stage-w);
      height: var(--stage-h);
      overflow: hidden;
      transform-origin: center center;
      background: var(--canvas);
      perspective: 1800px;
    }
    .fixed-stage-bg {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      filter: saturate(1.08) contrast(1.04) brightness(.98);
      pointer-events: none;
      user-select: none;
    }
    .figma-spotlight {
      position: absolute;
      z-index: 1;
      left: 23%;
      top: -18%;
      width: 72%;
      height: 108%;
      background:
        radial-gradient(ellipse at 57% 12%, rgba(255, 44, 78, .34) 0%, rgba(216, 23, 55, .21) 28%, rgba(112, 0, 19, .08) 55%, transparent 76%);
      filter: blur(46px) saturate(1.16);
      mix-blend-mode: screen;
      opacity: .68;
      pointer-events: none;
    }
    .fixed-tone {
      position: absolute;
      z-index: 2;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.48) 0%, rgba(0,0,0,.12) 38%, rgba(0,0,0,.04) 66%, rgba(0,0,0,.25) 100%),
        linear-gradient(180deg, rgba(0,0,0,.12) 0%, transparent 44%, rgba(0,0,0,.04) 100%);
      pointer-events: none;
    }
    .fixed-grid {
      position: absolute;
      z-index: 3;
      inset: 0;
      opacity: .09;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 128px 128px;
      mask-image: linear-gradient(to bottom, #000, transparent 82%);
      pointer-events: none;
    }
    .topbar {
      display: none;
    }
    .logo { display: block; width: 122px; height: auto; }
    .top-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: "DIN Alternate", "Avenir Next Condensed", sans-serif;
      color: rgba(255,255,255,.58);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .top-meta b { color: var(--orange); }
    .slides {
      position: absolute;
      z-index: 10;
      inset: 0;
      transform-style: preserve-3d;
    }
    .data-slide {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 103%, -110px) rotateX(-4deg) scale(.985);
      transform-origin: center top;
      transition:
        transform .76s cubic-bezier(.22,.72,0,1),
        opacity .34s ease,
        filter .46s ease;
      filter: blur(1.5px);
      will-change: transform, opacity;
    }
    .data-slide.past {
      transform: translate3d(0, -18%, -80px) rotateX(3deg) scale(.99);
      opacity: 0;
    }
    .data-slide.active {
      transform: translate3d(0, 0, 0) rotateX(0) scale(1);
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .data-slide.active .summary-strip { animation: panel-in .55s .12s both cubic-bezier(.22,.68,0,1); }
    .data-slide.active .chart-card { animation: panel-in .58s .2s both cubic-bezier(.22,.68,0,1); }
    .data-slide.active .kpi-card:first-child { animation: panel-in .5s .28s both cubic-bezier(.22,.68,0,1); }
    .data-slide.active .kpi-card:last-child { animation: panel-in .5s .34s both cubic-bezier(.22,.68,0,1); }
    @keyframes panel-in {
      from { transform: translateY(22px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .performance-head.figma-title-lockup {
      position: absolute;
      left: 0;
      right: 0;
      top: 65px;
      height: 154px;
      text-align: center;
    }
    .performance-ghost {
      margin: 0;
      font-family: "Arial Black", "Avenir Next", sans-serif;
      font-style: italic;
      font-size: 112px;
      line-height: .96;
      font-weight: 900;
      letter-spacing: -.065em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,.31);
      white-space: nowrap;
      transform: scaleX(1.12);
    }
    .performance-head h1 {
      position: absolute;
      top: 47px;
      left: 0;
      right: 0;
      margin: 0;
      font-family: "Avenir Next Condensed", "DIN Condensed", sans-serif;
      font-size: 39px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.035em;
      text-transform: uppercase;
      text-shadow: 0 6px 22px rgba(0,0,0,.72);
    }
    .performance-head h1 span {
      display: block;
      margin-top: 15px;
      color: rgba(255,255,255,.78);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .14em;
    }
    .page-kicker {
      position: absolute;
      left: 78px;
      top: 92px;
      font-family: "DIN Alternate", "Avenir Next Condensed", sans-serif;
      color: var(--orange-hot);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .summary-strip {
      position: absolute;
      left: 78px;
      right: 78px;
      top: 124px;
      min-height: 170px;
      display: grid;
      grid-template-columns: 1.25fr .88fr;
      background:
        linear-gradient(90deg, rgba(6,2,3,.51), rgba(75,9,20,.26) 58%, rgba(7,2,3,.54));
      border: 0;
      backdrop-filter: blur(7px);
    }
    .data-slide:first-child .summary-strip { top: 242px; min-height: 158px; }
    .summary-copy { padding: 27px 34px; display: flex; flex-direction: column; justify-content: center; }
    .summary-copy h2 {
      margin: 0 0 13px;
      font-family: "Avenir Next Condensed", "DIN Condensed", sans-serif;
      font-style: italic;
      font-size: 27px;
      line-height: 1.05;
      letter-spacing: .005em;
      text-transform: uppercase;
    }
    .summary-copy p {
      margin: 0;
      max-width: 740px;
      color: #d0c5c1;
      font-size: 15px;
      line-height: 1.6;
    }
    .race-mark {
      display: inline-grid;
      grid-template-columns: repeat(5, 8px);
      grid-template-rows: repeat(2, 8px);
      gap: 2px;
      margin-right: 15px;
      transform: skewX(-18deg) translateY(1px);
    }
    .race-mark i { background: currentColor; }
    .race-mark i:nth-child(even) { opacity: .18; }
    .summary-table {
      align-self: center;
      display: grid;
      grid-template-columns: 1.05fr 1fr 1fr;
      gap: 10px 28px;
      padding: 23px 35px;
      border-left: 0;
      text-align: right;
      font-size: 14px;
    }
    .summary-table .th {
      padding-bottom: 7px;
      border-bottom: 2px solid rgba(255,255,255,.34);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .summary-table b { color: #fff; font-weight: 800; }
    .summary-table .accent { color: var(--gold); font-weight: 800; }
    .summary-table.region-table { grid-template-columns: 1fr 1fr 1fr; gap: 8px 22px; }
    .visual-row {
      position: absolute;
      left: 78px;
      right: 78px;
      top: 319px;
      bottom: 61px;
      display: grid;
      grid-template-columns: 790px 318px;
      justify-content: space-between;
      align-items: end;
    }
    .data-slide:first-child .visual-row { top: 426px; }
    .chart-card {
      align-self: stretch;
      min-height: 0;
      padding: 26px 31px 25px;
      background: rgba(8, 4, 5, var(--figma-card-alpha));
      border: 0;
      border-radius: 13px;
      box-shadow: 0 26px 72px rgba(0,0,0,.24);
      backdrop-filter: blur(8px);
    }
    .chart-heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .chart-heading h3 {
      margin: 0;
      padding-left: 13px;
      border-left: 5px solid var(--red);
      font-size: 18px;
      line-height: 1.25;
    }
    .chart-heading span {
      flex: none;
      color: rgba(255,255,255,.48);
      font-family: "DIN Alternate", sans-serif;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .legend { display: flex; gap: 25px; margin: 17px 0 11px; color: #cbbfba; font-size: 11px; }
    .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 7px; vertical-align: -1px; background: var(--orange); }
    .legend span:last-child i { background: var(--red); }
    .chart-plot {
      position: relative;
      height: calc(100% - 77px);
      min-height: 210px;
      margin-left: 47px;
      border-left: 1px solid rgba(255,255,255,.27);
      border-bottom: 1px solid rgba(255,255,255,.34);
      background: repeating-linear-gradient(to top, transparent 0 20%, rgba(255,255,255,.085) 20.2% 20.7%);
    }
    .axis-tick {
      position: absolute;
      left: -9px;
      transform: translate(-100%, 50%);
      color: rgba(255,255,255,.48);
      font-size: 9px;
      white-space: nowrap;
    }
    .bar {
      position: absolute;
      bottom: 0;
      width: 82px;
      min-height: 3px;
      background: linear-gradient(to top, #7c1b09, var(--orange));
      box-shadow: inset 0 1px rgba(255,255,255,.38);
    }
    .bar.current { background: linear-gradient(to top, #8d1a0d, #ff6b22); }
    .bar b {
      position: absolute;
      left: 50%;
      top: -26px;
      transform: translateX(-50%);
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
    }
    .bar small {
      position: absolute;
      left: 50%;
      bottom: -25px;
      transform: translateX(-50%);
      color: #d8ceca;
      font-size: 10px;
      white-space: nowrap;
    }
    .share-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .share-svg line { stroke: #fff; stroke-width: 1.6; stroke-dasharray: 7 7; vector-effect: non-scaling-stroke; }
    .share-svg circle { fill: var(--red); stroke: #fff; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .share-pill {
      position: absolute;
      transform: translate(-50%, 10px);
      padding: 5px 8px;
      background: rgba(84,20,17,.94);
      color: #fff;
      font-size: 10px;
    }
    .kpi-stack { align-self: stretch; display: grid; grid-template-rows: 1fr 1fr; gap: 18px; padding-top: 0; }
    .kpi-card {
      padding: 22px 25px;
      background: rgba(8, 4, 5, calc(var(--figma-card-alpha) + .14));
      border: 0;
      border-radius: 13px;
      box-shadow: 0 22px 56px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kpi-tag {
      display: inline-block;
      align-self: flex-start;
      min-width: 182px;
      margin: -2px 0 16px -35px;
      padding: 7px 24px 7px 38px;
      background: var(--red);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      clip-path: polygon(8% 0,100% 0,92% 100%,0 100%);
    }
    .kpi-card strong { display: block; font-size: 39px; line-height: 1; letter-spacing: -.045em; }
    .kpi-card small { display: block; margin-top: 10px; color: #c9bdb8; font-size: 12px; }
    .monthly-plot { display: flex; align-items: end; gap: 28px; padding: 0 25px; }
    .monthly-plot .bar { position: relative; left: auto !important; flex: 1; max-width: 70px; }
    .region-plot { display: grid; grid-template-columns: repeat(4, 1fr); align-items: end; gap: 30px; padding: 0 20px; }
    .region-group { height: 100%; display: flex; justify-content: center; align-items: end; gap: 10px; position: relative; }
    .region-group .bar { position: relative; left: auto !important; width: 42px; }
    .region-group > b { position: absolute; left: 50%; bottom: -27px; transform: translateX(-50%); font-size: 10px; }
    .simple-plot .bar { width: 120px; }
    .slide-caption {
      position: absolute;
      z-index: 60;
      left: 78px;
      bottom: 25px;
      font-family: "DIN Alternate", sans-serif;
      color: rgba(255,255,255,.5);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .side-progress {
      position: absolute;
      z-index: 80;
      right: 27px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      gap: 13px;
    }
    .progress-tick {
      width: 9px;
      height: 1px;
      border: 0;
      padding: 0;
      background: rgba(255,255,255,.28);
      cursor: pointer;
      transition: width .25s ease, background .25s ease;
    }
    .progress-tick.active { width: 28px; background: var(--orange); transform: translateX(-19px); }
    .deck-controls {
      position: absolute;
      z-index: 90;
      right: 43px;
      bottom: 30px;
      display: grid;
      grid-template-columns: 34px;
      grid-template-rows: 34px auto 34px;
      align-items: center;
      gap: 5px;
    }
    .deck-controls button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.32);
      color: #fff;
      cursor: pointer;
    }
    .deck-controls button:hover { border-color: var(--orange); color: var(--orange); }
    .deck-controls button:disabled { opacity: .26; cursor: default; }
    .deck-counter {
      min-width: 34px;
      text-align: center;
      color: rgba(255,255,255,.66);
      font-family: "DIN Alternate", sans-serif;
      font-size: 9px;
      line-height: 1.35;
      letter-spacing: .04em;
    }
    .swipe-hint {
      position: absolute;
      z-index: 70;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.3);
      font-family: "DIN Alternate", sans-serif;
      font-size: 9px;
      letter-spacing: .18em;
      text-transform: uppercase;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .data-slide, .data-slide.active .summary-strip, .data-slide.active .chart-card,
      .data-slide.active .kpi-card { transition: none !important; animation: none !important; }
    }
  </style>
</head>

        {
          id: "seo-impressions", family: "SEO", title: "SEO 日均曝光",
          description: "SEO 日均曝光同比提升 22.5%。",
          previous: { label: "2025 H2", text: "338K", value: 338000 },
          current: { label: "2026 H1", text: "414K", value: 414000 },
          metric: "日均曝光",
          kpis: [
            { label: "日均曝光增长", value: "+22.5%", sub: "2026 H1 vs 2025 H2" },
            { label: "2026 H1 日均曝光", value: "414K", sub: "Daily impressions" }
          ],
          changeValue: "+22.5%",
          chartTitle: "SEO 日均曝光", ticks: ["0", "100K", "200K", "300K", "400K", "500K"], type: "simple"
        },
        {
          id: "seo-clicks", family: "SEO", title: "SEO 日均点击",
          description: "SEO 日均点击同比提升 28.7%。",
          previous: { label: "2025 H2", text: "10,571", value: 10571 },
          current: { label: "2026 H1", text: "13,609", value: 13609 },
          metric: "日均点击",
          kpis: [
            { label: "日均点击增长", value: "+28.7%", sub: "2026 H1 vs 2025 H2" },
            { label: "2026 H1 日均点击", value: "13,609", sub: "Daily clicks" }
          ],
          changeValue: "+28.7%",
          chartTitle: "SEO 日均点击", ticks: ["0", "3K", "6K", "9K", "12K", "15K"], type: "simple"
        }
      ];

      const slides = [...document.querySelectorAll(".data-slide")];
      const counter = document.querySelector(".deck-counter");
      const progress = document.querySelector(".side-progress");
      const prevButton = document.getElementById("ppt-prev");
      const nextButton = document.getElementById("ppt-next");
      const storageKey = "vantage-h1-figma-racing-data-deck-slide";
      const searchParams = new URLSearchParams(location.search);
      const embedded = searchParams.get("embedded") === "1";
      let index = 0;
      let wheelLocked = false;
      let pointerStartY = null;

      function ticksHtml(ticks) {
        return ticks.map((tick, i) => `<span class="axis-tick" style="bottom:${(i / (ticks.length - 1)) * 100}%">${tick}</span>`).join("");
      }

      function standardPlot(page) {
        const max = Math.max(page.previous.value, page.current.value) * 1.16;
        const h1 = Math.max(12, page.previous.value / max * 100);
        const h2 = Math.max(12, page.current.value / max * 100);
        const x1 = 31, x2 = 69;
        const y1 = 88 - (page.previous.share / 45 * 70);
        const y2 = 88 - (page.current.share / 45 * 70);
        return `
          <div class="chart-plot">
            ${ticksHtml(page.ticks)}
            <div class="bar" style="left:calc(${x1}% - 41px);height:${h1}%"><b>${page.previous.text}</b><small>${page.previous.label}</small></div>
            <div class="bar current" style="left:calc(${x2}% - 41px);height:${h2}%"><b>${page.current.text}</b><small>${page.current.label}</small></div>
            <svg class="share-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>
              <circle cx="${x1}" cy="${y1}" r="1.05"></circle>
              <circle cx="${x2}" cy="${y2}" r="1.05"></circle>
            </svg>
            <span class="share-pill" style="left:${x1}%;top:${y1}%">${page.previous.share.toFixed(1)}%</span>
            <span class="share-pill" style="left:${x2}%;top:${y2}%">${page.current.share.toFixed(1)}%</span>
          </div>`;
      }

      function simplePlot(page) {
        const max = Math.max(page.previous.value, page.current.value) * 1.18;
        return `
          <div class="chart-plot simple-plot">
            ${ticksHtml(page.ticks)}
            <div class="bar" style="left:calc(31% - 60px);height:${page.previous.value / max * 100}%"><b>${page.previous.text}</b><small>${page.previous.label}</small></div>
            <div class="bar current" style="left:calc(69% - 60px);height:${page.current.value / max * 100}%"><b>${page.current.text}</b><small>${page.current.label}</small></div>
          </div>`;
      }

      function monthlyPlot(page) {
        const max = 15;
        return `<div class="chart-plot monthly-plot">${ticksHtml(page.ticks)}${page.monthly.map((item, i) => `
          <div class="bar ${i === page.monthly.length - 1 ? "current" : ""}" style="height:${item.value / max * 100}%">
            <b>${item.text}</b><small>${item.label}</small>
          </div>`).join("")}</div>`;
      }

      function regionPlot(page) {
        const max = 12.5;
        return `<div class="chart-plot region-plot">${ticksHtml(page.ticks)}${page.regions.map(item => `
          <div class="region-group">
            <div class="bar" style="height:${item.previous / max * 100}%"><b>${item.previous.toFixed(1)}</b></div>
            <div class="bar current" style="height:${item.current / max * 100}%"><b>${item.current.toFixed(1)}</b></div>
            <b>${item.region}</b>
          </div>`).join("")}</div>`;
      }

      function tableHtml(page) {
        if (page.type === "region") {
          return `<div class="summary-table region-table">
            <div class="th">Region</div><div class="th">2025 H2 ROI</div><div class="th">2026 H1 ROI</div>
            ${page.regions.slice(0, 2).map(item => `<div>${item.region}</div><div>${item.previous.toFixed(1)}</div><div class="accent">${item.current.toFixed(1)}</div>`).join("")}
          </div>`;
        }
        const hasShare = Number.isFinite(page.previous.share);
        return `<div class="summary-table">
          <div class="th">Period</div><div class="th">${page.metric}</div><div class="th">${hasShare ? page.shareLabel : "Change"}</div>
          <div>${page.previous.label}</div><div><b>${page.previous.text}</b></div><div>${hasShare ? `${page.previous.share.toFixed(1)}%` : "Baseline"}</div>
          <div>${page.current.label}</div><div><b>${page.current.text}</b></div><div class="accent">${hasShare ? `${page.current.share.toFixed(1)}%` : page.changeValue}</div>
        </div>`;
      }

      function plotHtml(page) {
        if (page.type === "monthly") return monthlyPlot(page);
        if (page.type === "region") return regionPlot(page);
        if (page.type === "simple") return simplePlot(page);
        return standardPlot(page);
      }

      function renderSlide(slide, page, pageIndex) {
        const isFirst = pageIndex === 0;
        slide.innerHTML = `
          ${isFirst ? `<header class="performance-head figma-title-lockup"><p class="performance-ghost">PERFORMANCE</p><h1>整体表现<span>OVERALL PERFORMANCE</span></h1></header>` : ""}
          <div class="summary-strip">
            <div class="summary-copy">
              <h2>${raceMark}${page.title}</h2>
              <p>${page.description}</p>
            </div>
            ${tableHtml(page)}
          </div>
          <div class="visual-row">
            <article class="chart-card">
              <div class="chart-heading"><h3>${page.chartTitle}</h3><span>2025 H2 → 2026 H1</span></div>
              <div class="legend"><span><i></i>${page.type === "region" ? "2025 H2" : page.metric}</span><span><i></i>${page.type === "region" ? "2026 H1" : (page.shareLabel || "Current period")}</span></div>
              ${plotHtml(page)}
            </article>
            <aside class="kpi-stack">
              ${page.kpis.map(kpi => `<div class="kpi-card"><span class="kpi-tag">${kpi.label}</span><strong>${kpi.value}</strong><small>${kpi.sub}</small></div>`).join("")}
            </aside>
          </div>
          <div class="slide-caption">${String(pageIndex + 1).padStart(2, "0")} · ${page.family} · ${page.metric}</div>`;
      }

      pages.forEach((page, pageIndex) => {
        const slide = slides.find(item => item.dataset.pageId === page.id);
        renderSlide(slide, page, pageIndex);
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "progress-tick";
        dot.setAttribute("aria-label", `跳转到第 ${pageIndex + 1} 页：${page.title}`);
        dot.addEventListener("click", () => goTo(pageIndex));
        progress.appendChild(dot);
      });

      const dots = [...progress.children];

      function updateScale() {
        const scale = Math.min(innerWidth / 1600, innerHeight / 900);
        document.querySelector(".stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      function goTo(nextIndex) {
        const next = Math.max(0, Math.min(slides.length - 1, nextIndex));
        index = next;
        if (scrollX !== 0 || scrollY !== 0) scrollTo(0, 0);
        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("active", slideIndex === index);
          slide.classList.toggle("past", slideIndex < index);
        });
        dots.forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === index));
        counter.textContent = `${String(index + 1).padStart(2, "0")} / 10`;
        prevButton.disabled = !embedded && index === 0;
        nextButton.disabled = !embedded && index === slides.length - 1;
        try { localStorage.setItem(storageKey, String(index)); } catch (error) {}
        history.replaceState(null, "", `#slide-${index + 1}`);
      }

      function notifyBoundary(direction) {
        if (!embedded || window.parent === window) return false;
        window.parent.postMessage({ type: "vantage-figma-data-boundary", direction }, location.origin);
        return true;
      }

      function next() {
        if (index === slides.length - 1 && notifyBoundary(1)) return;
        goTo(index + 1);
      }
      function prev() {
        if (index === 0 && notifyBoundary(-1)) return;
        goTo(index - 1);
      }

      prevButton.addEventListener("click", prev);
      nextButton.addEventListener("click", next);
      addEventListener("keydown", event => {
        if (["ArrowDown", "PageDown", " "].includes(event.key)) { event.preventDefault(); next(); }
        if (["ArrowUp", "PageUp"].includes(event.key)) { event.preventDefault(); prev(); }
        if (event.key === "Home") goTo(0);
        if (event.key === "End") goTo(slides.length - 1);
      });
      addEventListener("wheel", event => {
        if (wheelLocked || Math.abs(event.deltaY) < 18) return;
        wheelLocked = true;
        event.deltaY > 0 ? next() : prev();
        setTimeout(() => { wheelLocked = false; }, 760);
      }, { passive: true });
      addEventListener("pointerdown", event => { pointerStartY = event.clientY; });
      addEventListener("pointerup", event => {
        if (pointerStartY === null) return;
        const distance = event.clientY - pointerStartY;
        pointerStartY = null;
        if (Math.abs(distance) < 70) return;
        distance < 0 ? next() : prev();
      });
      addEventListener("resize", updateScale);

      const hashMatch = location.hash.match(/slide-(\d+)/);
      if (hashMatch) index = Number(hashMatch[1]) - 1;
      else {
        try { index = Number(localStorage.getItem(storageKey)) || 0; } catch (error) {}
      }
      updateScale();
      goTo(index);
      window.__ready = true;
    })();
  </script>
